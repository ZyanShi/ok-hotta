name: Build

on:
  push:
    tags:
      - 'v*'

# 关键：显式授予 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ZyanShi@users.noreply.github.com"
          git config --global user.name "ZyanShi"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      # checkout 保持 v4（已兼容 Node.js 24）
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 升级到 v5 解决 Node.js 20 弃用警告
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 删除重复的 UTF-8 设置（已在 env 中定义），但保留无妨
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      # 改进测试：使用 discover 并指定 tests 目录，更健壮
      - name: Run tests
        run: |
          python -m unittest discover -s tests

      # 如果需要，可以保留同步步骤，但注释掉（您已删除）
      # - name: Sync Repositories
      #   uses: ok-oldking/partial-sync-repo@master
      #   ...

      # pyappify-action 暂未更新，保留 master（但警告会持续，可考虑固定 commit）
      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      # Release 使用 v2（已支持 Node.js 24）
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ### 版本 ${{ github.ref_name }}
            自动构建的 Release
          files: pyappify_dist/*
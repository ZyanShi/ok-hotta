name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Configure git (UTF-8 & line endings)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ZyanShi@users.noreply.github.com"
          git config --global user.name "ZyanShi"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5   # 从 v2 升级到 v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding (Windows)
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          echo "PYTHONLEGACYWINDOWSSTDIO=utf-8" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "⚠️ requirements.txt not found, skipping"
          }

      - name: Run inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          if (Test-Path .\tests\) {
            Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
            }
          } else {
            Write-Host "⚠️ No tests folder found, skipping tests"
          }

      # 删除或注释掉同步步骤，因为你不需要同步到原作者的仓库（已保留注释）
      # - name: Sync Repositories
      #   id: sync
      #   uses: ok-oldking/partial-sync-repo@master
      #   with:
      #     repos: |
      #       https://ok-oldking:${{ secrets.OK_GH }}@github.com/ok-oldking/ok-boilerplate-update.git
      #     sync_list: 'deploy.txt'
      #     tag: ${{ github.ref_name }}
      #     gitignore_file: '.update_repo_gitignore'
      #     show_author: true

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ### 版本 ${{ github.ref_name }}
            自动构建的 Release (Windows)
          files: pyappify_dist/*